<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="城楼大战 · Tower Clash —— 2.5D 横屏即时塔防，玩家 VS 骷髅军团。" />
    <title>城楼大战 · Tower Clash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- 顶栏 -->
      <div class="topbar">
        <a class="home-link" href="../index.html">‹ 返回</a>
        <div class="top-center">
          <span id="threat" class="threat">威胁 Lv.1</span>
          <span id="timer" class="timer">0:00</span>
          <span id="version" class="version"></span>
        </div>
        <div class="legend"><span class="dot p"></span><span id="legend-p">玩家</span> &nbsp; <span class="dot e"></span><span id="legend-e">骷髅</span></div>
      </div>

      <!-- 玩家2 HUD（顶部，PvP 时显示，由 JS 填充） -->
      <div id="hud-top" class="hud hud-top"></div>
      <!-- 玩家1 HUD（底部，由 JS 填充） -->
      <div id="hud-bottom" class="hud hud-bottom"></div>

      <!-- 解锁提示 -->
      <div id="toast" class="toast"></div>

      <!-- 开始菜单 -->
      <div id="menu" class="menu">
        <div class="menu-card">
          <h1>城楼大战 · Tower Clash ⚔️</h1>
          <p>选择对战模式</p>
          <div class="menu-btns">
            <button id="mode-pve" class="mode-btn">👤 玩家 vs 电脑</button>
            <button id="mode-pvp" class="mode-btn">👥 玩家 vs 玩家</button>
          </div>
        </div>
      </div>

      <!-- 结算 -->
      <div id="result" class="result hidden">
        <div class="result-card">
          <h2 id="result-title">胜利</h2>
          <p id="result-sub"></p>
          <div class="result-btns">
            <button id="restart-btn">再来一局</button>
            <button id="menu-btn" class="ghost">返回菜单</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">点城楼或“出兵路”选择路线，再点兵种出兵。键盘：1-9 出兵，↑/↓ 换路，Esc 取消瞄准。</p>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
