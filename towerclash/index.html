<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="城楼大战 · Tower Clash —— 2.5D 横屏即时塔防，玩家 VS 骷髅军团。" />
    <title>城楼大战 · Tower Clash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- 顶栏 -->
      <div class="topbar">
        <a class="home-link" href="../index.html">‹ 返回</a>
        <div class="top-center">
          <span id="threat" class="threat">威胁 Lv.1</span>
          <span id="timer" class="timer">0:00</span>
          <span id="version" class="version"></span>
        </div>
        <div class="legend"><span class="dot p"></span>玩家 &nbsp; <span class="dot e"></span>骷髅</div>
      </div>

      <!-- 底栏 -->
      <div class="bottombar">
        <div class="lane-col">
          <div class="lane-label">出兵路</div>
          <div id="lane-select" class="lane-select"></div>
        </div>
        <div class="energy">
          <div id="energy-pips" class="pips"></div>
          <div class="energy-num">⚡<span id="energy-num">5</span></div>
        </div>
        <div id="unit-buttons" class="unit-buttons"></div>
      </div>

      <!-- 解锁提示 -->
      <div id="toast" class="toast"></div>
      <!-- 放置/瞄准提示 -->
      <div id="aimhint" class="aimhint"></div>

      <!-- 结算 -->
      <div id="result" class="result hidden">
        <div class="result-card">
          <h2 id="result-title">胜利</h2>
          <p id="result-sub"></p>
          <button id="restart-btn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint">点城楼或下方“出兵路”选择路线，再点兵种出兵。键盘：1-4 出兵，↑/↓ 换路。</p>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
