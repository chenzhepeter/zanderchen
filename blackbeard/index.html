<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="黑胡子传奇 —— 以爱德华·蒂奇一生为主线的大航海开放世界 RPG，含三个结局。" />
    <title>黑胡子传奇 · Blackbeard's Wake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 开始菜单 -->
    <div id="start-screen" class="screen start">
      <div class="start-card">
        <p class="eyebrow">1697 — 1718 · 大西洋</p>
        <h1>黑胡子传奇</h1>
        <p class="sub">Blackbeard's Wake</p>
        <p class="tagline">
          你是爱德华·蒂奇。从布里斯托尔码头的学徒，到让整个西印度群岛发抖的名字——
          海图上有三条路通向终点，选哪条由你。
        </p>
        <div class="start-btns">
          <button id="btn-new" class="primary-btn big">⚓ 新的航程</button>
          <button id="btn-continue" class="ghost-btn big">📖 继续上次</button>
          <button id="btn-slots" class="ghost-btn big">📂 存档</button>
        </div>
        <p class="foot"><a href="../index.html">‹ 返回主页</a> · <span id="version"></span></p>
      </div>
    </div>

    <!-- 游戏主界面：港口主视野 / 近海航行视野 -->
    <div id="game-screen" class="screen game" hidden>
      <div id="hud" class="hud"></div>

      <!-- 近海航行视野 -->
      <div id="view-sail" class="view-stage hidden"><canvas id="scanvas"></canvas></div>

      <!-- 港口主视野：街景（靠港时的默认视野） -->
      <div id="view-port" class="view-stage"><canvas id="tcanvas"></canvas></div>

      <!-- 底部指令栏 -->
      <div id="cmd" class="cmdbar"></div>

      <!-- 侧栏面板（舰队/任务/日志） -->
      <aside id="panel" class="panel slide hidden"></aside>

      <!-- 设施面板：在港口视野里就地打开 -->
      <div id="town-panel" class="town-panel hidden">
        <div class="tp-head">
          <span id="tp-title"></span>
          <button id="tp-close" class="ghost-btn">✕ 出来</button>
        </div>
        <div id="tp-body" class="tp-body"></div>
      </div>
    </div>

    <!-- 全球海图（参考图，带迷雾） -->
    <div id="chart-view" class="chartview hidden">
      <div class="chart-bar">
        <b>🗺️ 海图</b>
        <span class="muted small">未到过的海域是空白的——航行会把它们画出来</span>
        <button id="chart-close" class="ghost-btn">✕ 收起</button>
      </div>
      <div class="chart-stage"><canvas id="cchart"></canvas></div>
    </div>

    <!-- 海战 -->
    <div id="battle" class="battle hidden">
      <div class="battle-stage"><canvas id="bcanvas"></canvas></div>
      <div class="battle-hud">
        <div id="binfo" class="battle-info"></div>
        <div id="bactions" class="battle-actions"></div>
      </div>
    </div>

    <!-- 决斗 -->
    <div id="duel" class="duel hidden">
      <div class="duel-card">
        <h2>⚔️ 甲板白刃战</h2>
        <div id="duel-body"></div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
